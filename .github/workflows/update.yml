name: LME data update
on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lme-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fetch data
        run: node scripts/fetch.mjs
      - name: Commit changes
        if: always()
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "LME data $(TZ=Asia/Seoul date '+%F %H:%M')"
          git pull --rebase --quiet || true
          git push
