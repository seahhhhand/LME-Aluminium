yaml
name: LME 데이터 업데이트

on:
  schedule:
    - cron: "0,30 0-3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lme-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 데이터 받기
        run: node scripts/fetch.mjs

      - name: 변경 사항 저장
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "LME 데이터 $(TZ=Asia/Seoul date +%F)"
          git push
